# Uploaded pictures (products, banners, blog posts) kept on this server once fetched, so repeat
# visits don't reach the backend. Each upload gets a new random file name and is never changed in
# place, so a kept copy is never out of date. Copies nobody asks for in 30 days are dropped.
proxy_cache_path /var/cache/nginx/files levels=1:2 keys_zone=files:10m max_size=2g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Product photos: up to 10 per save, 5 MB each (the backend's limits), plus the form fields.
    # nginx's default of 1 MB refused most photo uploads before they reached the backend.
    client_max_body_size 55m;
    # Room for the backend to upload a batch of photos to storage before answering.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location /api/ {
        proxy_pass http://backend:6767/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pictures: from this server's cache when it has them. The backend's own header
    # (Cache-Control: public, max-age=31536000, immutable) also lets browsers keep them for a year.
    location /api/files/ {
        proxy_pass http://backend:6767/files/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache files;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        # One request to the backend per new picture, however many visitors ask at once; and if the
        # backend is down or restarting, the kept copy is served instead of an error.
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location = /api {
        proxy_pass http://backend:6767/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Smaller downloads for text files: faster pages, which search engines also rank on.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml application/manifest+json;

    # Vite puts a content hash in every built file's name, so a browser can keep them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        # The app's page is always checked for a newer build.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
